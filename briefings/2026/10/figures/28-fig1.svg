<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"
     aria-labelledby="cgr-title cgr-desc">
  <title id="cgr-title">確信度の帯ごとのエスカレーション先</title>
  <desc id="cgr-desc">分類器の確信度が0.9以上なら実行、0.7から0.9は実行してログ、0.5から0.7はフロンティアLLMへ、0.5未満は人間へ回す。分類器は生成モデルから隔離される</desc>

  <rect x="0" y="0" width="720" height="300" fill="var(--fig-paper, #ffffff)"/>

  <text x="60" y="36" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">分類器の確信度と行き先（記事の初期閾値）</text>

  <!-- bands: 0 → 60, 1.0 → 660 -->
  <rect x="60" y="64" width="300" height="80" rx="6"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="210" y="100" text-anchor="middle" font-size="15"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">人間へ</text>
  <text x="210" y="122" text-anchor="middle" font-size="11"
        font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">conf &lt; 0.5</text>

  <rect x="364" y="64" width="112" height="80" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="420" y="100" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">フロンティア</text>
  <text x="420" y="122" text-anchor="middle" font-size="11"
        font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">0.5–0.7</text>

  <rect x="480" y="64" width="116" height="80" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="538" y="100" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">実行＋ログ</text>
  <text x="538" y="122" text-anchor="middle" font-size="11"
        font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">0.7–0.9</text>

  <rect x="600" y="64" width="60" height="80" rx="6"
        fill="var(--fig-paper, #ffffff)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="630" y="100" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">実行</text>
  <text x="630" y="122" text-anchor="middle" font-size="11"
        font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">≥0.9</text>

  <!-- axis -->
  <path d="M 60 160 H 660" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <path d="M 60 156 V 164 M 360 156 V 164 M 480 156 V 164 M 600 156 V 164 M 660 156 V 164"
        fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <g font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)" text-anchor="middle">
    <text x="60" y="180">0.0</text>
    <text x="360" y="180">0.5</text>
    <text x="480" y="180">0.7</text>
    <text x="600" y="180">0.9</text>
    <text x="660" y="180">1.0</text>
  </g>

  <!-- cost annotation -->
  <text x="60" y="216" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">1判断の単価: 分類器 約$0.000006 ／ フロンティア LLM 約$0.02（約3,333倍）</text>
  <text x="60" y="240" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">閾値は自分の分布で正解率を測ってから締める。Jev の較正データは未公開</text>

  <!-- legend -->
  <rect x="60" y="264" width="12" height="12" rx="2"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="80" y="275" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">人手コストが発生する帯</text>
  <rect x="260" y="264" width="12" height="12" rx="2"
        fill="var(--fig-paper, #ffffff)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="280" y="275" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">分類器だけで完結する帯</text>
</svg>
