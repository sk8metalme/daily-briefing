<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img"
     aria-labelledby="jevcost-title jevcost-desc">
  <title id="jevcost-title">Banking77 意図ルーティングのコストと精度</title>
  <desc id="jevcost-desc">横軸は100万判定あたりのコスト（対数）、縦軸は正解率。Jev 単体は安価だが精度が低く、Jev を前段に置いたハイブリッドは上位 LLM とほぼ同じ精度を約4割から6割のコストで出す</desc>

  <rect x="0" y="0" width="720" height="420" fill="var(--fig-paper, #ffffff)"/>

  <!-- 補助線 -->
  <path d="M 100 276 H 660 M 100 190 H 660 M 100 104 H 660" fill="none"
        stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- 軸 -->
  <path d="M 100 40 V 320 H 660" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1"/>

  <!-- 目盛りラベル（縦） -->
  <g font-family="'Geist Mono', monospace" font-size="11" fill="var(--fig-muted, #6b6f80)" text-anchor="end">
    <text x="92" y="280">78%</text>
    <text x="92" y="194">82%</text>
    <text x="92" y="108">86%</text>
  </g>
  <!-- 目盛りラベル（横） -->
  <g font-family="'Geist Mono', monospace" font-size="11" fill="var(--fig-muted, #6b6f80)" text-anchor="middle">
    <text x="152" y="340">$100</text>
    <text x="404" y="340">$1,000</text>
    <text x="656" y="340">$10,000</text>
  </g>
  <path d="M 152 320 V 324 M 404 320 V 324 M 656 320 V 324" fill="none"
        stroke="var(--fig-muted, #6b6f80)" stroke-width="1"/>

  <g font-family="Geist, 'Noto Sans JP', sans-serif" font-size="12" fill="var(--fig-ink, #2d3142)">
    <text x="380" y="360" text-anchor="middle">100万判定あたりのコスト（対数軸）</text>
    <text x="24" y="180" text-anchor="middle" transform="rotate(-90 24 180)">正解率</text>
  </g>

  <!-- 点: 単体 LLM -->
  <g fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-ink, #2d3142)" stroke-width="1">
    <circle cx="124" cy="248" r="5"/>
    <circle cx="168" cy="220" r="5"/>
    <circle cx="360" cy="228" r="5"/>
    <circle cx="500" cy="120" r="5"/>
    <circle cx="640" cy="108" r="5"/>
  </g>
  <!-- 点: Jev 単体と Jev+Opus（淡い強調なし） -->
  <rect x="143" y="267" width="10" height="10" fill="var(--fig-paper, #ffffff)"
        stroke="var(--fig-ink, #2d3142)" stroke-width="1"/>
  <rect x="527" y="115" width="10" height="10" fill="var(--fig-paper, #ffffff)"
        stroke="var(--fig-ink, #2d3142)" stroke-width="1"/>
  <!-- アクセント1: Jev 0.9+ → GPT-6 Sol ハイブリッド -->
  <rect x="387" y="127" width="10" height="10" fill="var(--fig-accent, #bf4520)"
        stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>

  <!-- ラベル -->
  <g font-family="Geist, 'Noto Sans JP', sans-serif" font-size="12" fill="var(--fig-ink, #2d3142)">
    <text x="116" y="236" text-anchor="end">DeepSeek V4 Flash</text>
    <text x="160" y="292">Jev 1.13 単体</text>
    <text x="176" y="216">GPT-6 Luna</text>
    <text x="368" y="244">Gemini 3.5 Flash</text>
    <text x="492" y="100" text-anchor="end">GPT-6 Sol</text>
    <text x="544" y="144">Jev → Opus</text>
    <text x="632" y="92" text-anchor="end">Claude Opus 5.5</text>
  </g>
  <!-- アクセント2: 注釈 -->
  <text x="392" y="164" text-anchor="middle" font-size="12"
        font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-accent, #bf4520)">Jev → Sol　84.7% / $895</text>

  <!-- 凡例 -->
  <g font-family="Geist, 'Noto Sans JP', sans-serif" font-size="11" fill="var(--fig-muted, #6b6f80)">
    <circle cx="112" cy="392" r="5" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-ink, #2d3142)" stroke-width="1"/>
    <text x="124" y="396">LLM 単体</text>
    <rect x="203" y="387" width="10" height="10" fill="var(--fig-paper, #ffffff)" stroke="var(--fig-ink, #2d3142)" stroke-width="1"/>
    <text x="220" y="396">Jev を含む構成</text>
    <rect x="335" y="387" width="10" height="10" fill="var(--fig-accent, #bf4520)"/>
    <text x="352" y="396">Jev（確信度0.9以上）＋ GPT-6 Sol に残り34%</text>
  </g>
</svg>
