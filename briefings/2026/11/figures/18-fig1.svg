<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img"
     aria-labelledby="meta-pod-title meta-pod-desc">
  <title id="meta-pod-title">Meta の AI ポッド化で起きた出力と成果の乖離</title>
  <desc id="meta-pod-desc">コード変更は前年比220%増だったが、ユーザーに届いた機能は36%増にとどまり、重大インシデントは40%増、消火対応時間は70%増えた（LeadDev 報道の数値）</desc>

  <rect x="0" y="0" width="720" height="380" fill="var(--fig-paper, #ffffff)"/>

  <text x="24" y="36" font-size="15" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">前年比の増加率（Meta の AI ポッド、LeadDev / Reuters 報道）</text>

  <!-- baseline -->
  <path d="M 200 64 V 300" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>

  <!-- 1 code changes -->
  <text x="188" y="92" text-anchor="end" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">コード変更量</text>
  <rect x="200" y="72" width="440" height="32" rx="2"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="652" y="93" font-size="13" font-family="'Geist Mono', monospace"
        fill="var(--fig-ink, #2d3142)">+220%</text>

  <!-- 2 features shipped (accent 1) -->
  <text x="188" y="148" text-anchor="end" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">ユーザーに届いた機能</text>
  <rect x="200" y="128" width="72" height="32" rx="2"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="284" y="149" font-size="13" font-family="'Geist Mono', monospace"
        fill="var(--fig-accent, #bf4520)">+36%</text>

  <!-- 3 incidents -->
  <text x="188" y="204" text-anchor="end" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">重大インシデント</text>
  <rect x="200" y="184" width="80" height="32" rx="2"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="292" y="205" font-size="13" font-family="'Geist Mono', monospace"
        fill="var(--fig-ink, #2d3142)">+40%</text>

  <!-- 4 firefighting time (accent 2) -->
  <text x="188" y="260" text-anchor="end" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">消火対応の時間</text>
  <rect x="200" y="240" width="140" height="32" rx="2"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="352" y="261" font-size="13" font-family="'Geist Mono', monospace"
        fill="var(--fig-accent, #bf4520)">+70%</text>

  <!-- callout -->
  <rect x="400" y="180" width="296" height="96" rx="6"
        fill="var(--fig-paper, #ffffff)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="416" y="208" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">出力は約3倍、成果は約1.4倍。</text>
  <text x="416" y="232" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">差分はレビューと運用の負荷として</text>
  <text x="416" y="256" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">組織に戻ってきた</text>

  <!-- legend -->
  <rect x="24" y="332" width="16" height="12" rx="2"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="48" y="343" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">出力・副作用</text>
  <rect x="160" y="332" width="16" height="12" rx="2"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="184" y="343" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-muted, #6b6f80)">判断に使うべき指標（成果と負担）</text>
  <text x="696" y="343" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace"
        fill="var(--fig-muted, #6b6f80)">bar = 2px / 1%</text>
</svg>
