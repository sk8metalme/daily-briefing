<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="dk-title dk-desc">
  <title id="dk-title">供給者オンボーディング振り分け: コストと正答率の位置関係</title>
  <desc id="dk-desc">横軸は1000件あたりコスト（対数）、縦軸は期待どおりの振り分け率。Jev は 0.03 ドルで 79%、GPT-5.6 Luna は 0.25 ドルで 85%、GPT-5.6 Sol は 4.35 ドルで 87%。境界ケースだけを LLM に回すハイブリッドは記事内で未検証</desc>
  <rect x="0" y="0" width="720" height="420" fill="var(--fig-paper, #ffffff)"/>

  <!-- axes -->
  <path d="M 120 320 H 620" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <path d="M 120 64 V 320" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>

  <!-- y ticks -->
  <text x="108" y="324" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">75%</text>
  <text x="108" y="244" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">80%</text>
  <text x="108" y="164" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">85%</text>
  <text x="108" y="84" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">90%</text>
  <path d="M 120 240 H 620 M 120 160 H 620 M 120 80 H 620" fill="none" stroke="var(--fig-paper-2, #ecebe8)" stroke-width="1"/>

  <!-- x ticks -->
  <text x="120" y="340" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">$0.01</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">$0.1</text>
  <text x="440" y="340" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">$1</text>
  <text x="600" y="340" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">$10</text>

  <text x="372" y="364" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">1000件あたりコスト（対数軸）</text>
  <text x="24" y="196" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" transform="rotate(-90 24 196)">期待どおりに振り分けた割合</text>

  <!-- hybrid region (unverified) -->
  <rect x="196" y="120" width="148" height="136" rx="6" fill="none" stroke="var(--fig-link, #2f6f8f)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="204" y="112" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-link, #2f6f8f)">ハイブリッド候補（未検証）</text>

  <!-- Jev (accent) -->
  <circle cx="196" cy="256" r="8" fill="var(--fig-accent, #bf4520)"/>
  <text x="212" y="276" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-accent, #bf4520)">Jev 1.13</text>
  <text x="212" y="292" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">79% / $0.03 / 0.3s</text>

  <!-- Luna -->
  <circle cx="344" cy="160" r="6" fill="var(--fig-ink, #2d3142)"/>
  <text x="356" y="164" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">GPT-5.6 Luna</text>
  <text x="356" y="180" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">85% / $0.25 / 3.0s</text>

  <!-- Sol -->
  <circle cx="540" cy="128" r="6" fill="var(--fig-ink, #2d3142)"/>
  <text x="532" y="104" text-anchor="end" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">GPT-5.6 Sol</text>
  <text x="532" y="120" text-anchor="end" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">87% / $4.35 / 2.2s</text>

  <!-- legend -->
  <circle cx="128" cy="392" r="6" fill="var(--fig-accent, #bf4520)"/>
  <text x="140" y="396" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">決定モデル</text>
  <circle cx="240" cy="392" r="6" fill="var(--fig-ink, #2d3142)"/>
  <text x="252" y="396" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">LLM（構造化出力）</text>
  <text x="400" y="396" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">n=200 / 出典: Dataiku</text>
</svg>
