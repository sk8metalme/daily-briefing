<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"
     aria-labelledby="agp-title agp-desc">
  <title id="agp-title">エージェント対応プラットフォームのレイヤースタック</title>
  <desc id="agp-desc">従来の内部開発者プラットフォームの上に、ID とアクセス、ゲートウェイ、ビルディングブロック、コントロールの4層を積む。最上部でエージェントが API・CLI・MCP 経由で利用する</desc>

  <rect x="0" y="0" width="720" height="400" fill="var(--fig-paper, #ffffff)"/>

  <!-- 利用者 -->
  <rect x="40" y="24" width="300" height="40" rx="6"
        fill="var(--fig-paper, #ffffff)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="190" y="49" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">人間（UI・ポータル）</text>
  <rect x="380" y="24" width="300" height="40" rx="6"
        fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="530" y="49" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">エージェント（API・CLI・MCP）</text>

  <!-- コントロール -->
  <rect x="40" y="84" width="640" height="52" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="56" y="106" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">コントロール</text>
  <text x="56" y="126" font-size="11" font-family="'Geist Mono', monospace"
        fill="var(--fig-muted, #6b6f80)">ツール呼び出し前のポリシー判定 / 本番の承認ゲート / ドリフト検知 / 監査証跡</text>

  <!-- ビルディングブロック -->
  <rect x="40" y="148" width="640" height="52" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="56" y="170" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">ビルディングブロック</text>
  <text x="56" y="190" font-size="11" font-family="'Geist Mono', monospace"
        fill="var(--fig-muted, #6b6f80)">ハーネス / エージェント・スキル登録簿 / コンテキスト層 / 専用ゴールデンパス / サンドボックス</text>

  <!-- ゲートウェイ -->
  <rect x="40" y="212" width="640" height="52" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="56" y="234" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">ゲートウェイ</text>
  <text x="56" y="254" font-size="11" font-family="'Geist Mono', monospace"
        fill="var(--fig-muted, #6b6f80)">LLM ゲートウェイ（予算・レート制限） / MCP・ツールゲートウェイ（許可リスト）</text>

  <!-- ID -->
  <rect x="40" y="276" width="640" height="52" rx="6"
        fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="56" y="298" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif"
        fill="var(--fig-ink, #2d3142)">ID とアクセス</text>
  <text x="56" y="318" font-size="11" font-family="'Geist Mono', monospace"
        fill="var(--fig-muted, #6b6f80)">エージェントごとの短命 ID（SPIFFE / ワークロード ID 連携） / 実行時に取得する秘密情報</text>

  <!-- 基盤 -->
  <rect x="40" y="340" width="640" height="40" rx="6"
        fill="var(--fig-paper, #ffffff)" stroke="var(--fig-ink, #2d3142)" stroke-width="1"/>
  <text x="360" y="365" text-anchor="middle" font-size="13"
        font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">従来の内部開発者プラットフォーム（ゴールデンパス・パイプライン・メタデータ）</text>
</svg>
