<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="pyr-title pyr-desc">
  <title id="pyr-title">AI-Readiness のピラミッド</title>
  <desc id="pyr-desc">下から リポジトリ衛生、可観測性、プラットフォーム設定、堅牢な CI/CD、環境設計 の5層が積み上がり、その上に Dark Factory が乗る。決定的レイヤーである下5層への投資が先であることを示す。</desc>

  <rect x="0" y="0" width="720" height="360" fill="var(--fig-paper, #ffffff)"/>

  <!-- 層: 下ほど幅が広い -->
  <rect x="36" y="248" width="432" height="44" rx="6" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>
  <rect x="68" y="200" width="368" height="44" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="100" y="152" width="304" height="44" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="132" y="104" width="240" height="44" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="164" y="56" width="176" height="44" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="196" y="16" width="112" height="36" rx="6" fill="var(--fig-paper, #ffffff)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" stroke-dasharray="4 4"/>

  <g font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" text-anchor="middle" font-size="13">
    <text x="252" y="274">1 リポジトリ衛生</text>
    <text x="252" y="226">2 可観測性</text>
    <text x="252" y="178">3 プラットフォーム設定</text>
    <text x="252" y="130">4 堅牢な CI/CD</text>
    <text x="252" y="82">5 環境設計</text>
    <text x="252" y="38">Dark Factory</text>
  </g>

  <!-- 右側の中身 -->
  <g font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)" font-size="11">
    <text x="484" y="274">lint=error / hooks / lockfile / 契約</text>
    <text x="452" y="226">構造化ログ / OTel / LLM 実行ログ</text>
    <text x="420" y="178">最小権限 IAM / secrets / MCP 権限</text>
    <text x="388" y="130">trunk green / flag / 自動 rollback</text>
    <text x="356" y="82">環境パリティ / sandbox / memory</text>
  </g>

  <!-- 決定的レイヤーの括弧（直交線のみ） -->
  <path d="M 24 56 H 16 V 292 H 24" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1"/>

  <text x="16" y="320" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">左括弧＝決定的レイヤー（記事の主張: 投資不足はここ）。強調＝最初に手を付ける層</text>
  <text x="16" y="340" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">出典: Connor Ludwig, AI Adoption: An Engineering Readiness Guide</text>
</svg>
