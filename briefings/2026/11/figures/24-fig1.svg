<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="arl-title arl-desc">
  <title id="arl-title">Agent Readiness Levels と SIMPL チームの現在地</title>
  <desc id="arl-desc">Factory の5段階 Agent Readiness Levels を左から右へ並べ、SIMPL チームがレベル3と4の間にいることを示す。次の段階への条件はフレーキーテストの体系的検出。</desc>

  <rect x="0" y="0" width="720" height="300" fill="var(--fig-paper, #ffffff)"/>

  <!-- 段階バー: 左から右へ高さが上がる階段 -->
  <rect x="24" y="168" width="128" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="160" y="144" width="128" height="72" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="296" y="120" width="128" height="96" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="432" y="96" width="128" height="120" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="568" y="72" width="128" height="144" rx="6" fill="var(--fig-paper, #ffffff)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" stroke-dasharray="4 4"/>

  <g font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" text-anchor="middle">
    <text x="88" y="188" font-size="13">L1 Functional</text>
    <text x="224" y="164" font-size="13">L2 Documented</text>
    <text x="360" y="140" font-size="13">L3 Standardized</text>
    <text x="496" y="116" font-size="13">L4 Optimized</text>
    <text x="632" y="92" font-size="13">L5 Autonomous</text>
  </g>
  <g font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)" text-anchor="middle" font-size="11">
    <text x="88" y="206">README / lint / 型</text>
    <text x="224" y="184">AGENTS.md</text>
    <text x="224" y="200">pre-commit</text>
    <text x="360" y="160">結合テスト</text>
    <text x="360" y="176">secret scan</text>
    <text x="360" y="192">tracing</text>
    <text x="496" y="136">高速 CI</text>
    <text x="496" y="152">flaky 検出</text>
    <text x="632" y="112">自己改善</text>
  </g>

  <!-- 現在地マーカー（アクセント1） -->
  <path d="M 428 56 V 228" fill="none" stroke="var(--fig-accent, #bf4520)" stroke-width="2"/>
  <rect x="356" y="32" width="144" height="24" rx="2" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="428" y="48" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">SIMPL の現在地</text>

  <!-- 注釈 -->
  <text x="24" y="256" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">L3→L4 の残課題: フレーキーテストの体系的検出（記事時点で進行中）</text>
  <text x="24" y="276" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">出典: Factory Agent Readiness Levels（記事内で引用）</text>
</svg>
