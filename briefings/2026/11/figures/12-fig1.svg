<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img"
     aria-labelledby="mr-title mr-desc">
  <title id="mr-title">マージリスクの2軸: 影響範囲 × ロールバックコスト</title>
  <desc id="mr-desc">Warp の記事が PR 記述に必須とする「影響」と「ロールバックコスト」を2軸に取り、象限ごとに人間のレビュー注意をどこへ配分するかを示す。右上（高影響かつ一方通行の変更）だけがコードオーナーの精査とスタック PR 分割の対象になる。</desc>

  <rect x="0" y="0" width="720" height="440" fill="var(--fig-paper, #ffffff)"/>

  <!-- 軸 -->
  <path d="M 120 360 H 680" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" marker-end="url(#mr-arrow)"/>
  <path d="M 120 360 V 40" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" marker-end="url(#mr-arrow)"/>
  <path d="M 400 48 V 360" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 120 200 H 672" fill="none" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="400" y="388" text-anchor="middle" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">ロールバックコスト →（二方向ドア … 一方通行ドア）</text>
  <text x="40" y="200" text-anchor="middle" font-size="13" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" transform="rotate(-90 40 200)">影響範囲 →（auth・権限・課金）</text>

  <!-- 左下 -->
  <rect x="136" y="216" width="248" height="128" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="152" y="244" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">低影響 × 戻しやすい</text>
  <text x="152" y="272" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">レビューエージェントの指摘を</text>
  <text x="152" y="292" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">解消済みなら人は差分を流し読み</text>

  <!-- 右下 -->
  <rect x="416" y="216" width="248" height="128" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="432" y="244" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">低影響 × 戻しにくい</text>
  <text x="432" y="272" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">移行手順・ロールバック手順を</text>
  <text x="432" y="292" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">PR 記述で重点確認</text>

  <!-- 左上 -->
  <rect x="136" y="56" width="248" height="128" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="152" y="84" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">高影響 × 戻しやすい</text>
  <text x="152" y="112" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">コードオーナーへルーティング</text>
  <text x="152" y="132" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">エラー監視の追加を必須化</text>

  <!-- 右上（アクセント） -->
  <rect x="416" y="56" width="248" height="128" rx="6" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="432" y="84" font-size="14" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-accent, #bf4520)">高影響 × 一方通行</text>
  <text x="432" y="112" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">スタック PR に分割し</text>
  <text x="432" y="132" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">人の注意をここへ集中させる</text>
  <text x="432" y="160" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">例: 破壊的スキーマ移行</text>

  <!-- 凡例 -->
  <rect x="120" y="408" width="12" height="12" rx="2" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="140" y="418" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">人間の精査を集中させる象限</text>
  <rect x="340" y="408" width="12" height="12" rx="2" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="360" y="418" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">エージェントの事前作業で注意を節約する象限</text>

  <defs>
    <marker id="mr-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--fig-rule, #c4c3bf)"/>
    </marker>
  </defs>
</svg>
