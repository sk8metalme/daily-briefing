<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"
     aria-labelledby="fdorg-title fdorg-desc">
  <title id="fdorg-title">エンジニアリング組織の二分割モデル</title>
  <desc id="fdorg-desc">Run-the-business と Bet-taking factory を分け、小さなエンジニアリング機能がツール・インターフェース・堅牢化で両者を支える</desc>
  <defs>
    <marker id="fdorg-arrow" viewBox="0 0 8 8" refX="7" refY="4"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--fig-muted, #6b6f80)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="400" fill="var(--fig-paper, #ffffff)"/>

  <!-- arrows first -->
  <path d="M 200 236 V 184" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1" marker-end="url(#fdorg-arrow)"/>
  <path d="M 520 236 V 184" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1" marker-end="url(#fdorg-arrow)"/>
  <path d="M 380 112 H 460" fill="none" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5" marker-end="url(#fdorg-arrow)"/>
  <rect x="384" y="88" width="72" height="16" fill="var(--fig-paper, #ffffff)"/>
  <text x="420" y="100" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">硬化して移管</text>

  <!-- Run the business -->
  <rect x="40" y="40" width="320" height="144" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="200" y="72" text-anchor="middle" font-size="15" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">Run-the-business</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">最適化対象: 信頼性・キャッシュフロー</text>
  <text x="200" y="120" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">資本効率・人件費</text>
  <text x="200" y="152" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">既存プロダクトの運用と改善</text>

  <!-- Bet-taking factory (accent) -->
  <rect x="460" y="40" width="220" height="144" rx="6" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>
  <text x="570" y="72" text-anchor="middle" font-size="15" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">Bet-taking factory</text>
  <text x="570" y="100" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">最適化対象: 実験・オプション</text>
  <text x="570" y="132" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">Commercial AI Engineer</text>
  <text x="570" y="152" text-anchor="middle" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">70% coder + 70% operator</text>

  <!-- Engineering platform (thin, wide) -->
  <rect x="40" y="236" width="640" height="88" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="360" y="264" text-anchor="middle" font-size="15" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">小さく、てこの効いたエンジニアリング機能</text>
  <text x="160" y="300" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">ツール提供</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">インターフェース（API・MCP）</text>
  <text x="560" y="300" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">出荷モジュールの堅牢化</text>

  <!-- legend -->
  <rect x="40" y="356" width="12" height="12" rx="2" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1"/>
  <text x="60" y="366" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">意図的に資源配分しないと Run 側に吸収される機能</text>
  <rect x="380" y="356" width="12" height="12" rx="2" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="400" y="366" font-size="11" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-muted, #6b6f80)">既存の組織機能</text>
</svg>
