<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="djan-title djan-desc">
  <title id="djan-title">Dependabot Janitor の絞り込みファネル</title>
  <desc id="djan-desc">組織全体の Dependabot PR が、決定的フィルタ、テストスイート評価、マージ可否判定を経て、自動マージ約250件と人間へ差し戻し800件超に分かれる。モデルが判断するのは決定的フィルタを通過した PR だけである。</desc>

  <rect x="0" y="0" width="720" height="380" fill="var(--fig-paper, #ffffff)"/>

  <!-- 段: 上ほど幅が広い -->
  <rect x="40" y="24" width="440" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="72" y="84" width="376" height="48" rx="6" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>
  <rect x="104" y="144" width="312" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="136" y="204" width="248" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="168" y="264" width="184" height="40" rx="6" fill="var(--fig-paper, #ffffff)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>

  <g font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" text-anchor="middle" font-size="13">
    <text x="260" y="53">組織全体の Dependabot PR（夜間検索）</text>
    <text x="260" y="113">決定的フィルタ（Cloud Run Function）</text>
    <text x="260" y="173">assess-test-suite（ルート単位）</text>
    <text x="260" y="233">check-if-can-merge / CI 診断</text>
    <text x="260" y="289">自動マージ 約250件</text>
  </g>

  <!-- 右側: 落ちたものの行き先 -->
  <g font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)" font-size="11">
    <text x="464" y="113">opt-in・semver 上限・mergeable</text>
    <text x="432" y="173">回帰を検知できない → 停車</text>
    <text x="400" y="233">赤い CI・major → 推奨のみ</text>
  </g>

  <!-- 差し戻しの集約（直交線のみ） -->
  <path d="M 600 180 V 324 H 520" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1"/>
  <path d="M 568 240 H 600" fill="none" stroke="var(--fig-muted, #6b6f80)" stroke-width="1"/>
  <rect x="352" y="312" width="168" height="28" rx="2" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <text x="436" y="331" text-anchor="middle" font-size="12" font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)">人間へ 800件超（調査付き）</text>

  <text x="16" y="364" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">強調＝モデルを入れない境界と最終出口。数値は導入7週間・約30リポジトリ。出典: ZenBusiness Tech</text>
</svg>
