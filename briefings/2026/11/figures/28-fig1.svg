<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="synvm-title synvm-desc">
  <title id="synvm-title">Synthesia の SAST 所見トリアージ・ファネル</title>
  <desc id="synvm-desc">週次の SAST 所見は、まずルール層（重大度ポリシーと Semgrep Assistant）で約71%が自動処理される。残り29%を3体の独立エージェントが検証し、18%が偽陽性として自動クローズ、11%が真陽性として修正 PR に進む。人間が判断するのは PR レビューの段だけである。</desc>

  <rect x="0" y="0" width="720" height="360" fill="var(--fig-paper, #ffffff)"/>

  <!-- 段: 上ほど幅が広い -->
  <rect x="40" y="24" width="440" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="72" y="84" width="376" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="104" y="144" width="312" height="48" rx="6" fill="var(--fig-accent-tint, #f6e3dc)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>
  <rect x="136" y="204" width="248" height="48" rx="6" fill="var(--fig-paper-2, #ecebe8)" stroke="var(--fig-rule, #c4c3bf)" stroke-width="1"/>
  <rect x="168" y="264" width="184" height="40" rx="6" fill="var(--fig-paper, #ffffff)" stroke="var(--fig-accent, #bf4520)" stroke-width="1.5"/>

  <g font-family="Geist, 'Noto Sans JP', sans-serif" fill="var(--fig-ink, #2d3142)" text-anchor="middle" font-size="13">
    <text x="260" y="53">週次の SAST 所見（100%）</text>
    <text x="260" y="113">ルール層: 重大度ポリシー＋AI 偽陽性判定</text>
    <text x="260" y="173">3エージェント独立検証（29%）</text>
    <text x="260" y="233">真陽性 11% → 修正 PR 自動作成</text>
    <text x="260" y="289">人間は PR をレビュー</text>
  </g>

  <!-- 右側: 落ちたものの行き先 -->
  <g font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)" font-size="11">
    <text x="496" y="53">前処理: 休眠リポ約1/3を archive</text>
    <text x="464" y="113">約71% を自動 accept / close</text>
    <text x="432" y="173">偽陽性 18% は即クローズ</text>
    <text x="400" y="233">修正確認後に issue 自動クローズ</text>
  </g>

  <text x="16" y="340" font-size="11" font-family="'Geist Mono', monospace" fill="var(--fig-muted, #6b6f80)">強調＝エージェント検証の段と人間の最終関門。数値は記事記載の週次 SAST 比率。出典: Synthesia</text>
</svg>
