name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "selected-articles.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "briefings/**"
      - "selected-articles.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 日次ブリーフィングの push は1日に複数回走ることがあるため、
# 進行中のデプロイはキャンセルせず順番に流す。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r site/requirements.txt

      - name: Build site
        run: python site/build.py

      - name: Verify output
        run: |
          set -eu
          for f in index.html archive.html articles.html about.html search-index.json; do
            test -s "_site/$f" || { echo "missing or empty: _site/$f" >&2; exit 1; }
          done
          pages=$(find _site/briefings -name '*.html' | wc -l)
          echo "briefing pages: $pages"
          test "$pages" -gt 0 || { echo "no briefing pages were generated" >&2; exit 1; }

      # Pages へのアップロードは main のみ。PR ではビルドが通ることだけを確認する。
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
