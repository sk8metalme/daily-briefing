name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "selected-articles.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 日次ブリーフィングの push は1日に複数回走ることがあるため、
# 進行中のデプロイはキャンセルせず順番に流す。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r site/requirements.txt

      - name: Build site
        run: python site/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
